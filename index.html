<style>
:root{--rose:#f3d3d6;--rose2:#e3a9b1;--beige:#efe4d8;--bg:#fbf6f1;--card:#fffdfb;--ink:#201b1b;--mut:#7a6d6d;--line:#eadfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--rose:#4a2f33;--rose2:#c98a93;--beige:#2c2524;--bg:#171414;--card:#221d1d;--ink:#f6ece8;--mut:#b5a6a3;--line:#352d2d}}
:root[data-theme="dark"]{--rose:#4a2f33;--rose2:#c98a93;--beige:#2c2524;--bg:#171414;--card:#221d1d;--ink:#f6ece8;--mut:#b5a6a3;--line:#352d2d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;font-weight:700}
.wrap{max-width:560px;margin:auto;padding:0 16px}
.hero{background:linear-gradient(160deg,var(--rose),var(--beige));padding:22px 16px 18px;border-radius:0 0 28px 28px}
.hero .wrap{display:flex;gap:14px;align-items:center;padding:0}
.hero img{width:68px;height:68px;border-radius:20px;object-fit:cover;box-shadow:0 6px 18px #0002;border:2px solid #fff8}
.hero h1{font-size:24px}.hero p{margin:2px 0 0;color:var(--mut);font-size:13px}
.bar{height:8px;background:#fff6;border-radius:9px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .3s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;max-width:170px;border:0;background:none;color:var(--mut);font:600 13px Inter,sans-serif;padding:9px;border-radius:14px}
nav button.on{background:var(--ink);color:var(--bg)}
.wk{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.wk button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
.wk div{text-align:center}.wk b{font:700 20px 'Playfair Display',Georgia,serif}.wk small{display:block;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.cal a{text-align:center;padding:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:11px;color:var(--mut);text-decoration:none}
.cal a b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.cal a.s{background:var(--rose)}.cal a.d{background:var(--ink)}.cal a.d b,.cal a.d{color:var(--bg)}
.note{background:var(--beige);border-radius:18px;padding:12px 14px;font-size:13.5px;margin:10px 0}
.note b{font-family:'Playfair Display',Georgia,serif}
.tg{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 14px;margin:10px 0;font-size:14px}
.tg input{accent-color:#c9747f;width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #c9747f14}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card h2{font-size:19px}.card header small{color:var(--mut)}
.pill{background:var(--rose);color:var(--ink);font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.exw{border-top:1px solid var(--line);padding:10px 0}
.ex{display:flex;align-items:center;gap:12px}
.ck input{display:none}.ck span{display:block;width:26px;height:26px;border-radius:9px;border:2px solid var(--rose2);background:var(--card)}
.ck input:checked+span{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 5px var(--rose)}
.exm{flex:1}.exm b{display:block;font-size:15px}.exm small{color:var(--mut)}
.ld{width:68px;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 15px Inter,sans-serif;text-align:center}
details{margin:6px 0 0 38px;font-size:13.5px}
summary{color:#b05a66;font-weight:600;cursor:pointer;padding:3px 0}
details p{margin:5px 0;color:var(--ink)}details p span{color:var(--mut)}
textarea,.in{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:10px;font:14px Inter,sans-serif}
textarea{margin-top:10px;min-height:56px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.cell b{display:block;font-size:17px}.cell small{color:var(--mut);font-size:11px}.cell.bl{background:var(--rose)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.f2 label{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.g details{margin:0;border-top:1px solid var(--line);padding:12px 0}.g summary{font:700 17px 'Playfair Display',Georgia,serif;color:var(--ink)}
.g ul{padding-left:18px;margin:8px 0}.g li{margin:4px 0}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:20px 0}

const D=[['Lun','A'],['Mar','B'],['Mer',0],['Jeu','C'],['Ven',0],['Sam','D'],['Dim',0]];
const G=['Apprendre les mouvements, 4 reps en réserve.','Régularité : 4 séances sur 4.','+1–2 kg si le haut de la fourchette est atteint.','Semaine tampon (−1 série) + BILAN 1.','Hip thrust : 8–10 reps avec +5 kg.','Monter les charges aux machines.','Pause 1–2 s en haut sur chaque rép.','Semaine tampon + BILAN 2.','Hip thrust : descente en 3 s.','Surcharge progressive partout.','Dernier bloc : 1–2 reps en réserve.','Semaine tampon + BILAN FINAL.'];
const PH=w=>w<=4?'Phase 1 · Apprentissage':w<=8?'Phase 2 · Progression':'Phase 3 · Intensification';
const BL=[4,8,12];
let st={c:{},l:{},n:{},b:{}},wk=1,tab='p',fat=false;
try{st=JSON.parse(localStorage.getItem('bg')||'null')||st}catch(e){}
const save=()=>{try{localStorage.setItem('bg',JSON.stringify(st))}catch(e){}};
const K=(w,id,i)=>w+'-'+id+'-'+i;
const pc=(w,id)=>{const s=S.find(x=>x.id==id);return s.ex.filter((_,i)=>st.c[K(w,id,i)]).length/s.ex.length};
const wp=w=>'ABCD'.split('').reduce((a,id)=>a+pc(w,id),0)/4;
const $=s=>document.querySelector(s);
function prog(){const t=[...Array(12)].reduce((a,_,i)=>a+wp(i+1),0)/12;$('#gp').style.width=Math.round(t*100)+'%'}
function viewP(){
 const tamp=BL.includes(wk),red=fat||tamp;
 let h=`<div class=wk><button data-w=-1>‹</button><div><b>Semaine ${wk}</b><small>${PH(wk)}</small></div><button data-w=1>›</button></div>
 <div class=cal>${D.map(([d,id])=>`<a href="#" data-go="${id}" class="${id?(pc(wk,id)==1?'d':'s'):''}">${d}<b>${id||'·'}</b></a>`).join('')}</div>
 <div class=note><b>Objectif :</b> ${G[wk-1]}<br>Monte la charge (+2,5 kg ; +5 kg au hip thrust) quand toutes les séries atteignent le haut de la fourchette avec 2 reps en réserve.</div>
 <label class=tg><input type=checkbox id=fat ${fat?'checked':''}><span>Jour de fatigue ou douleur pelvienne : −1 série, charges −20 %, saute le dernier exercice si besoin.</span></label>`;
 S.forEach(s=>{h+=`<section class=card id=s${s.id}><header><div><small>${s.day}</small><h2>${s.t}</h2></div><span class=pill>${s.tag}</span></header>`;
 s.ex.forEach((e,i)=>{const k=K(wk,s.id,i),sets=Math.max(2,e[2]-(red?1:0)),pr=st.l[K(wk-1,s.id,i)]||'kg';
 h+=`<div class=exw><div class=ex><label class=ck><input type=checkbox data-k="${k}" ${st.c[k]?'checked':''}><span></span></label><div class=exm><b>${e[0]}</b><small>${sets} × ${e[3]} · repos ${e[4]}</small></div><input class=ld inputmode=decimal data-l="${k}" placeholder="${pr}" value="${st.l[k]||''}"></div>
 <details><summary>Technique & conseils</summary><p><span>Machine :</span> ${e[1]}</p><p><span>Départ :</span> ${e[5]}</p><p><span>Muscles :</span> ${e[6]}</p><p><span>Technique :</span> ${e[7]}</p><p><span>À éviter :</span> ${e[8]}</p><p><span>Pourquoi :</span> ${e[9]}</p></details></div>`});
 h+=`<textarea data-n="${wk}-${s.id}" placeholder="Mes sensations, mes progrès…">${st.n[wk+'-'+s.id]||''}</textarea></section>`});
 return h+`<p class=foot>Échauffement 5–8 min avant chaque séance. Arrête tout mouvement douloureux ou instable.</p>`}
function viewS(){
 let h=`<div class=wk><div><b>Suivi sur 12 semaines</b><small>% de séances réalisées</small></div></div><div class=grid>`;
 for(let w=1;w<=12;w++)h+=`<div class="cell ${BL.includes(w)?'bl':''}" data-wk=${w}><small>S${w}${BL.includes(w)?' · bilan':''}</small><b>${Math.round(wp(w)*100)}%</b></div>`;
 h+=`</div><p class=note>Touche une semaine pour l’ouvrir. Les charges saisies dans chaque séance restent enregistrées sur ce téléphone.</p>`;
 BL.forEach(w=>{h+=`<section class=card><header><h2>Bilan semaine ${w}</h2></header><div class=f2>${[['p','Poids (kg)'],['t','Tour de taille (cm)'],['h','Hanches (cm)'],['f','Fessiers (cm)'],['c','Cuisse (cm)'],['hp','Hip thrust (kg × reps)']].map(([f,l])=>`<div><label>${l}</label><input class=in inputmode=decimal data-b="${w}-${f}" value="${st.b[w+'-'+f]||''}"></div>`).join('')}</div><textarea data-b="${w}-n" placeholder="Énergie, douleurs, ressenti, photos prises…">${st.b[w+'-n']||''}</textarea></section>`});
 return h}
const GU=[
['Fessiers : ce qui marche',`<ul><li><b>Haut & rondeur :</b> hip thrust / glute drive, extensions de hanche, pause en haut.</li><li><b>Moyen fessier :</b> abductions (machine, poulie) : élargit et arrondit sur le côté.</li><li><b>Hip dips :</b> liés à ta structure osseuse (bassin, fémur). On ne les fait pas disparaître, mais plus de muscle sur le moyen fessier peut les rendre visuellement moins marqués.</li><li><b>Progresser :</b> +2,5 à +5 kg dès que la fourchette haute est atteinte, 2 reps en réserve.</li><li>Priorité aux exercices ci-dessus, pas à ceux qui sont juste populaires sur TikTok.</li></ul>`],
['Taille & abdos',`<ul><li>Gainage, dead bug, reverse crunch et anti-rotation renforcent le transverse (le « corset ») sans épaissir les obliques.</li><li>Pas de crunchs lestés ni de flexions latérales avec charge.</li><li>La largeur de taille dépend surtout de ta cage thoracique et de ton bassin. Le muscle des fessiers et des épaules accentue le contraste.</li><li>La graisse ne se perd pas à un endroit choisi. Vacuum : si tu as des douleurs pelviennes, parles-en d’abord à ton médecin ou kiné.</li></ul>`],
['Cellulite & cardio',`<ul><li>Muscle plus ferme + bonne hydratation peuvent améliorer l’aspect, mais la cellulite ne disparaît pas totalement : elle dépend de la génétique, des hormones et de la structure de la peau.</li><li><b>Cardio :</b> marche inclinée 2 fois par semaine, 15–25 min, à allure facile (jour de repos ou après la séance).</li><li>Pas de cardio intense qui grignote la récupération ni les calories.</li></ul>`],
['Alimentation',`<ul><li><b>Protéines :</b> ~1,6–2 g/kg, soit environ 80–100 g/jour, répartis sur 3–4 repas.</li><li>Pas de déficit : mange à ta faim, glucides à chaque repas, surtout autour de l’entraînement.</li><li><b>Petit-déj :</b> skyr + flocons d’avoine + fruits ; ou œufs + pain complet + avocat.</li><li><b>Déjeuner :</b> poulet / poisson / tofu (120–150 g) + riz ou patate douce + légumes + huile d’olive.</li><li><b>Avant séance :</b> banane + yaourt, ou tartine + miel. <b>Après :</b> fromage blanc + fruit, ou smoothie protéiné.</li><li><b>Dîner :</b> saumon, pâtes complètes, lentilles, légumes cuits.</li><li><b>Récupération :</b> eau, sommeil 7–9 h, oméga-3, aliments riches en magnésium et en fer.</li></ul>`],
['À quoi s’attendre',`<table><tr><th>Quand</th><th>Réaliste</th></tr><tr><td>4–8 sem.</td><td>Force qui monte, technique, énergie, mieux-être</td></tr><tr><td>3 mois</td><td>Premiers changements visibles, fessiers plus fermes</td></tr><tr><td>6 mois</td><td>Volume et forme plus marqués, posture</td></tr><tr><td>12 mois</td><td>Vraie recomposition, selon ta génétique et ta régularité</td></tr></table>`],
['Santé, douleurs & genou',`<ul><li>Fais valider les mouvements à risque par un médecin ou un kiné (rotule, bassin).</li><li>Genou : pas de fente profonde, pas de sauts. Presse : amplitude limitée à environ 90°. Le Bulgarian split squat n’est <b>pas</b> au programme au départ.</li><li>Douleur pelvienne ou grande fatigue : active le « jour de fatigue » (−1 série, −20 %) ou fais seulement marche + mobilité.</li><li>Expire à l’effort, ne bloque pas ta respiration.</li><li>Stop immédiat si une douleur aiguë, une sensation d’instabilité ou un blocage apparaît.</li><li>Ce programme ne remplace pas un avis médical.</li></ul>`]];
function viewG(){return `<div class=wk><div><b>Le guide</b><small>Comprendre pour progresser</small></div></div><div class=g>${GU.map(([t,b])=>`<details><summary>${t}</summary>${b}</details>`).join('')}</div>`}
function render(){$('#app').innerHTML=tab=='p'?viewP():tab=='s'?viewS():viewG();prog()}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.t){tab=t.dataset.t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b==t));render();scrollTo(0,0)}
 const w=t.closest('[data-w]');if(w){wk=Math.min(12,Math.max(1,wk+ +w.dataset.w));render()}
 const c=t.closest('[data-wk]');if(c){wk=+c.dataset.wk;tab='p';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t=='p'));render();scrollTo(0,0)}
 const g=t.closest('[data-go]');if(g){e.preventDefault();const s=$('#s'+g.dataset.go);s&&s.scrollIntoView({behavior:'smooth'})}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='fat'){fat=t.checked;render();return}
 if(t.dataset.k){st.c[t.dataset.k]=t.checked;save();prog();const id=t.dataset.k.split('-')[1],a=document.querySelector(`.cal a[data-go="${id}"]`);if(a)a.className=pc(wk,id)==1?'d':'s'}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.l)st.l[t.dataset.l]=t.value;
 if(t.dataset.n)st.n[t.dataset.n]=t.value;
 if(t.dataset.b)st.b[t.dataset.b]=t.value;save()});
render();
